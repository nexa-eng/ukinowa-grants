name: weekly

on:
  schedule:
    - cron: "0 20 * * 0"   # 毎週月曜 05:00 JST
  workflow_dispatch:
    inputs:
      max_llm:
        description: "AI 判定の上限件数（0〜300）"
        type: number
        default: 120

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 生成物の置き場（data ブランチ）を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 収集・判定・生成・通知
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAX_LLM: ${{ inputs.max_llm || 120 }}
          DATA_ROOT: ${{ github.workspace }}/data
        run: python -m grants.run --llm
      - name: 結果を data ブランチにコミット
        if: always()
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ukinowa-grants-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore: 週次更新 $(TZ=Asia/Tokyo date +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
